<!doctype html>
<html lang="en-US">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>Video — Fiction2Reality</title>

    <meta
        name="description"
        content="Fiction2Reality video">

    <meta
        name="color-scheme"
        content="light dark">

    <meta
        name="theme-color"
        content="#0d1416">

    <link
        rel="icon"
        type="image/png"
        sizes="48x48"
        href="/assets/img/branding/favicon-48.png">

    <link
        rel="preload"
        href="/assets/fonts/lora-latin-normal-400-700-v1.woff2"
        as="font"
        type="font/woff2"
        crossorigin>

    <script src="/assets/js/theme-init.js"></script>

    <link
        rel="stylesheet"
        href="/assets/css/main.css">

    <script
        type="module"
        src="/assets/js/main.js">
    </script>
</head>

<body>
    <div id="header-placeholder"></div>

    <main id="main-content">

        <article class="video-detail">

            <div class="container">

                <nav
                    class="breadcrumbs"
                    aria-label="Breadcrumb"
                    data-video-breadcrumbs>
                </nav>

                <header class="video-detail__header">

                    <p
                        class="eyebrow"
                        data-video-world>
                    </p>

                    <h1 data-video-title></h1>

                    <p
                        class="video-detail__lede"
                        data-video-description>
                    </p>

                </header>

                <div
                    class="video-detail__player"
                    data-video-player>
                </div>

                <div
                    class="video-detail__actions"
                    data-video-actions>
                </div>

                <div class="video-detail__content">

                    <section
                        class="video-detail__section"
                        data-video-about>
                    </section>

                    <section
                        class="video-detail__section"
                        data-video-metadata>
                    </section>

                    <section
                        class="video-detail__section"
                        data-video-production>
                    </section>

                    <section
                        class="video-detail__section"
                        data-video-transcript>
                    </section>

                    <section
                        class="video-detail__section"
                        data-video-notes>
                    </section>

                    <section
                        class="video-detail__section"
                        data-related-videos>
                    </section>

                </div>

            </div>

        </article>

    </main>

    <div id="footer-placeholder"></div>
</body>
</html>
